<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/style.css">
    <script src="https://unpkg.com/typewriter-effect@latest/dist/core.js"></script>
    <!-- <script src="https://unpkg.com/axios/dist/axios.min.js"></script> -->
     <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <title> AI French-poem</title>
</head>
<body>
    <div class="container">
    <header>
        <h1>AI French Poem Generator</h1>
    </header>
    <main>
        <div class="form-box">
            <form>
            <input type="text" name="search" class="instructions" id="topic-searchBox" placeholder="Enter the topic of french poem" autofocus required autocomplete="off">
            <input type="submit" class="submit-button" id="submit-button">
        </form>
        <div class="example">i.e flowers,paris,rose,chese</div>
        </div>
        
        <div class="poem-generator hidden" id="poem">
        </div>
    </main>
    <footer>
        <p> This AI project was coded by 
            <a href="https://github.com/asiya2123">Sk.Asiya</a>
            and  is <a href="https://github.com/asiya2123/french-poem-generator">open source on GitHub</a> 
            and is <a href="https://app.netlify.com/projects/frenchpoemgeneratai/overview">hosted on Netlify</a>
        </p>
    </footer> 
    </div>
  
<script src="src/script.js"></script>
</body>
</html>
