<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/style.css">
    <title> AI French-poem</title>
</head>
<body>
    <header>
        <h1>AI French Poem Generator</h1>
    </header>
    <main>
        <form>
            <input type="text" name="search" id="" placeholder="Enter the topic of french poem" autofocus required autocomplete="off">
            <input type="submit">
        </form>
        <div>
            <p>
                Beneath the evening sky with golden hues,
                <br>
                Stars are born in gentle calm.
                <br>
                The wind whispers to sleeping leaves,
                <br>
                Ancient secrets kept by the night.
            </p>
        </div>
    </main>
    <footer>
        <p> This AI project was coded by 
            <a href="https://github.com/asiya2123">Sk.Asiya</a>
            and  is <a href="https://github.com/asiya2123/french-poem-generator">open source on GitHub</a> 
            and is <a href="https://app.netlify.com/projects/frenchpoemgeneratai/overview">hosted on Netlify</a>
        </p>
    </footer>
<script src="src/script.js"></script>
</body>
</html>
